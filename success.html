<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameKeys — Order</title><style>body{margin:0;background:#08080f;color:#fff;font-family:Inter,system-ui;padding:40px}.box{max-width:700px;margin:8vh auto;background:#11111b;border:1px solid #282838;border-radius:22px;padding:30px}h1{margin-top:0}.muted{color:#aaa6ba;line-height:1.6}.key{font-size:24px;letter-spacing:.08em;background:#09090f;border:1px solid #48e0a4;border-radius:14px;padding:18px;margin:20px 0;word-break:break-all}a,button{display:inline-block;color:#fff;background:#171724;border:1px solid #303044;border-radius:12px;padding:12px 16px;text-decoration:none;cursor:pointer;font-weight:800}</style></head><body><div class="box"><h1 id="title">Order status</h1><div id="content" class="muted">Checking payment…</div><a href="/">Back to store</a></div><script>const id=new URLSearchParams(location.search).get('order_id');async function run(){if(!id){document.getElementById('content').textContent='Order ID is missing.';return}const r=await fetch('/api/order/'+encodeURIComponent(id));const d=await r.json();if(d.status==='paid'){document.getElementById('title').textContent='Payment confirmed';document.getElementById('content').innerHTML='<p>Your key:</p><div class="key">'+d.code+'</div><p>Transaction: '+d.txHash+'</p>'}else document.getElementById('content').textContent='Payment is still waiting for blockchain confirmation.'}run()</script></body></html>
