<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameKeys Admin</title><style>body{margin:0;background:#08080f;color:#fff;font-family:Inter,system-ui;padding:30px}.box{max-width:1000px;margin:auto;background:#11111b;border:1px solid #282838;border-radius:18px;padding:24px}input,button{padding:11px;border-radius:10px;border:1px solid #33334a;background:#0c0c14;color:#fff}button{cursor:pointer;font-weight:800}.row{display:grid;grid-template-columns:1fr 140px 180px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid #242433}.muted{color:#aaa6ba}@media(max-width:800px){.row{grid-template-columns:1fr}}</style></head><body><div class="box"><h1>GameKeys Orders</h1><p class="muted">Private admin view. Do not share this URL or your admin token.</p><input id="token" type="password" placeholder="Admin token"><button onclick="loadOrders()">Load orders</button><div id="list" style="margin-top:20px"></div></div><script>async function loadOrders(){const token=document.getElementById('token').value.trim();const r=await fetch('/api/admin/orders',{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok){document.getElementById('list').textContent=d.error||'Error';return}document.getElementById('list').innerHTML='<div class="row"><b>Order</b><b>Amount</b><b>Status</b><b>Transaction</b></div>'+d.orders.map(o=>'<div class="row"><span>'+o.id+'</span><span>'+o.amountUsdt+' USDT</span><span>'+o.status+'</span><span>'+((o.txHash||'—'))+'</span></div>').join('')}</script></body></html>
