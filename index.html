<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GameKeys — GTA VI</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#09090d;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.wrap{width:min(560px,100%)}.card{background:linear-gradient(145deg,#15131d,#0f0f15);border:1px solid #2b2635;border-radius:24px;padding:32px;box-shadow:0 25px 80px #0008}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font-weight:800;letter-spacing:.5px}.langs button{background:none;border:0;color:#777;cursor:pointer;font-weight:700}.langs button.active{color:#fff}.hero{text-align:center;margin-bottom:30px}.badge{display:inline-block;padding:7px 12px;border-radius:999px;background:#24152b;color:#e79cff;font-size:12px;font-weight:800}.hero h1{font-size:42px;margin:16px 0 8px}.hero p{color:#a6a3ad;margin:0}.price{font-size:36px;font-weight:900;margin:22px 0 4px}.network{color:#8e8997;font-size:14px}.field{margin-top:24px}.field label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}.field input{width:100%;padding:15px 16px;border-radius:13px;border:1px solid #34303e;background:#0a0a0f;color:#fff;outline:none}.field input:focus{border-color:#b64cff}.wallet{margin-top:20px;padding:16px;border:1px solid #302b39;border-radius:14px;background:#0b0b10}.wallet small{display:block;color:#8e8997;margin-bottom:8px}.addr{word-break:break-all;font-family:monospace;font-size:13px;color:#ddd;line-height:1.5}.copy{margin-top:12px;width:100%;padding:11px;border:1px solid #393441;background:#17151d;color:#fff;border-radius:10px;cursor:pointer}.pay{width:100%;margin-top:22px;padding:16px;border:0;border-radius:13px;background:linear-gradient(90deg,#a83dff,#e24cff);color:#fff;font-size:16px;font-weight:900;cursor:pointer}.pay:disabled{opacity:.5;cursor:not-allowed}.note{color:#817d89;font-size:12px;line-height:1.5;text-align:center;margin-top:16px}.result{display:none;margin-top:20px;padding:16px;border-radius:13px;background:#102016;border:1px solid #214d2d;color:#b9efc5;line-height:1.5}.footer{text-align:center;color:#66616d;font-size:11px;margin-top:20px}@media(max-width:500px){.card{padding:22px}.hero h1{font-size:34px}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<div class="top"><div class="brand">GAMEKEYS</div><div class="langs"><button id="en" class="active" onclick="setLang('en')">EN</button><span>/</span><button id="ru" onclick="setLang('ru')">RU</button></div></div>
<div class="hero"><span class="badge">DIGITAL KEY</span><h1>GTA VI</h1><p id="sub">Digital game key</p><div class="price">45 USDT</div><div class="network">TRON (TRC-20)</div></div>
<div class="field"><label id="emailLabel" for="email">Your email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div>
<div class="wallet"><small id="walletLabel">Send exactly 45 USDT (TRC-20) to:</small><div class="addr" id="address">TR2d7UdwBjuqZaGHr7ioa3BdLsAep3jo8r</div><button class="copy" id="copy" onclick="copyAddress()">Copy address</button></div>
<button class="pay" id="paid" onclick="paid()">I've Paid</button>
<div class="result" id="result"></div>
<div class="note" id="note">Payment is checked manually. If payment is confirmed, the key will be sent to your email within 2–3 hours.</div>
<div class="footer">GTA VI digital key • Manual payment verification</div>
</div></div>
<script>
let lang='en';
const t={en:{sub:'Digital game key',email:'Your email',wallet:'Send exactly 45 USDT (TRC-20) to:',copy:'Copy address',copied:'Copied!',paid:'I\'ve Paid',note:'Payment is checked manually. If payment is confirmed, the key will be sent to your email within 2–3 hours.',result:'Payment request noted for <b>{email}</b>.<br><br>Please keep this page. Your payment will be checked manually.'},ru:{sub:'Цифровой игровой ключ',email:'Ваш email',wallet:'Отправьте ровно 45 USDT (TRC-20) на:',copy:'Скопировать адрес',copied:'Скопировано!',paid:'Я оплатил',note:'Оплата проверяется вручную. Если платёж подтверждён, ключ будет отправлен на ваш email в течение 2–3 часов.',result:'Заявка отмечена для <b>{email}</b>.<br><br>Сохраните эту страницу. Платёж будет проверен вручную.'}};
function setLang(l){lang=l;document.documentElement.lang=l;document.getElementById('en').classList.toggle('active',l==='en');document.getElementById('ru').classList.toggle('active',l==='ru');document.getElementById('sub').textContent=t[l].sub;document.getElementById('emailLabel').textContent=t[l].email;document.getElementById('walletLabel').textContent=t[l].wallet;document.getElementById('copy').textContent=t[l].copy;document.getElementById('paid').textContent=t[l].paid;document.getElementById('note').textContent=t[l].note}
function copyAddress(){navigator.clipboard.writeText(document.getElementById('address').textContent).then(()=>{const b=document.getElementById('copy');b.textContent=t[lang].copied;setTimeout(()=>b.textContent=t[lang].copy,1200)})}
function paid(){const email=document.getElementById('email').value.trim();if(!/^\S+@\S+\.\S+$/.test(email)){document.getElementById('email').focus();return}document.getElementById('result').innerHTML=t[lang].result.replace('{email}',email);document.getElementById('result').style.display='block';document.getElementById('paid').disabled=true}
</script>
</body>
</html>
